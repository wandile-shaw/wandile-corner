<style>
:root{--bg:#050816;--ink:#e6eeff;--mute:#8d9bc4;--acc:#7fb0ff;--card:#0d1430;--line:#1f2c5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.hero{position:relative;height:66vh;min-height:440px;max-height:600px;overflow:hidden;display:grid;place-items:end center;text-align:center}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%;animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.03)}to{transform:scale(1.12) translateY(-10px)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--bg) 97%),radial-gradient(circle at 50% 0%,rgba(47,139,255,.22),transparent 60%)}
.t{position:relative;z-index:2;padding:0 20px 22px}
h1{font-size:clamp(44px,15vw,80px);letter-spacing:.28em;text-indent:.28em;font-weight:800;line-height:1;background:linear-gradient(90deg,#fff 0,#8fc0ff 35%,#fff 50%,#8fc0ff 65%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(88,178,255,.85));animation:shine 7s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.t p{margin-top:12px;color:#b9c9ef;letter-spacing:.3em;font-size:12px;text-transform:uppercase}
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:6px 20px 36px}
h2{font-size:12px;letter-spacing:.32em;color:var(--acc);text-transform:uppercase;margin:10px 2px 16px}
.ep{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:14px;border-radius:18px;text-decoration:none;color:var(--ink);background:linear-gradient(145deg,#13224f,var(--card));border:1px solid rgba(88,178,255,.45);box-shadow:0 12px 30px rgba(0,0,0,.65),0 0 24px rgba(47,139,255,.2);transition:transform .2s,box-shadow .25s;animation:rise .7s ease both,glow 3.4s ease-in-out 1s infinite;-webkit-tap-highlight-color:transparent}
.ep:nth-of-type(2){animation:rise .7s ease .14s both}.ep:nth-of-type(3){animation:rise .7s ease .28s both}
a.ep:active{transform:scale(.98)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes glow{50%{box-shadow:0 12px 30px rgba(0,0,0,.65),0 0 40px rgba(70,150,255,.55)}}
.th{flex:none;width:76px;height:76px;border-radius:14px;background:#02030a center/cover;border:1px solid rgba(88,178,255,.45)}
.n{font-size:11px;letter-spacing:.26em;color:var(--mute)}
.ti{font-size:21px;font-weight:700;margin:3px 0 8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:99px}
.live{background:rgba(52,240,122,.12);color:#6dffa0;border:1px solid rgba(52,240,122,.4)}
.live i,.dev i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
.soon{background:rgba(127,176,255,.1);color:var(--acc);border:1px solid rgba(127,176,255,.35)}
.dev{background:rgba(255,190,70,.1);color:#ffc65c;border:1px solid rgba(255,190,70,.4)}
.go{margin-left:auto;font-size:24px;color:var(--acc)}
.lock{border-color:var(--line);box-shadow:none;background:var(--card);animation:rise .7s ease .28s both!important}
.lock .th{display:grid;place-items:center;font-size:26px;background:#080d20}
.red{display:block;height:22px;width:150px;margin:5px 0 9px;border-radius:3px;background:#01020a;box-shadow:0 0 0 1px #1d2a58;position:relative;overflow:hidden}
.red::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(127,176,255,.25),transparent);transform:translateX(-100%);animation:scan 3s ease-in-out infinite}
@keyframes scan{to{transform:translateX(100%)}}
.bar{height:4px;border-radius:2px;background:#16204a;margin-top:11px;overflow:hidden}
.bar b{display:block;height:100%;width:38%;background:repeating-linear-gradient(45deg,#ffc65c 0 8px,#b07d1c 8px 16px);background-size:22px 22px;animation:slide 2.2s linear infinite}
@keyframes slide{to{background-position:22px 0}}
.rate{margin:26px 0 0;padding:20px;border-radius:18px;background:linear-gradient(145deg,#13224f,var(--card));border:1px solid rgba(88,178,255,.3);text-align:center;animation:rise .7s ease .4s both}
.rate h2{margin:0 0 12px}
.stars{display:flex;justify-content:center;gap:6px}
.stars button{background:none;border:0;font-size:38px;line-height:1;color:#2a3a6e;padding:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s,color .15s}
.stars button.on{color:#ffc65c;text-shadow:0 0 14px rgba(255,190,70,.7)}
.stars button:active{transform:scale(1.2)}
#rmsg{margin:10px 0 0;color:var(--mute);font:14px system-ui,sans-serif}
footer{position:relative;z-index:2;text-align:center;color:var(--mute);font-size:13px;padding:6px 0 34px}
#reader{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
#reader.open{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#rbar{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:#070c20;border-bottom:1px solid var(--line)}
#rbar button{font:600 14px system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid rgba(88,178,255,.4);border-radius:10px;padding:8px 14px}
#rbar span{font-size:11px;letter-spacing:.25em;color:var(--mute);text-transform:uppercase}
#reader iframe{flex:1;width:100%;border:0;background:#070b1a}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<canvas id="rain"></canvas>
<section class="hero"><img src="p0.jpg" alt="Eclipse crouching on a rooftop at night">
<div class="t"><h1>ECLIPSE</h1><p>An illustrated superhero novel</p></div></section>
<main>
<h2>Choose your episode</h2>
<a class="ep" href="#episode-1" id="ep1"><div class="th" style="background-image:url(p0.jpg)"></div><div><div class="n">EPISODE 1</div><div class="ti">The Other Life</div><span class="chip live"><i></i>Read now</span></div><div class="go">&rarr;</div></a>
<a class="ep" href="#episode-2" id="ep2"><div class="th" style="background-image:url(e2-01.jpg)"></div><div><div class="n">EPISODE 2</div><div class="ti">Loose Ends</div><span class="chip live"><i></i>Read now</span></div><div class="go">&rarr;</div></a>
<a class="ep" href="#episode-3" id="ep3"><div class="th" style="background-image:url(e3-12.jpg)"></div><div><div class="n">EPISODE 3</div><div class="ti">The Man Who Disappeared</div><span class="chip live"><i></i>Read now</span></div><div class="go">&rarr;</div></a>
<div class="ep lock"><div class="th">&#128274;</div><div style="flex:1"><div class="n">EPISODE 4</div><span class="red"></span><span class="chip dev"><i></i><span id="cd4">Coming soon</span></span></div></div>
<div class="rate" id="rate" hidden><h2>Rate Eclipse</h2><div class="stars" id="stars"><button type="button" data-s="1" aria-label="1 star">&#9733;</button><button type="button" data-s="2" aria-label="2 stars">&#9733;</button><button type="button" data-s="3" aria-label="3 stars">&#9733;</button><button type="button" data-s="4" aria-label="4 stars">&#9733;</button><button type="button" data-s="5" aria-label="5 stars">&#9733;</button></div><p id="rmsg"></p></div>
</main>
<footer><a href="/" style="color:inherit;text-decoration:none">&larr; Wandile's Internet Corner</a><br>&copy; Wandile</footer>
<div id="reader" aria-hidden="true"><div id="rbar"><button id="rb" type="button">&larr; Episodes</button><span id="rt">Eclipse &middot; Episode 1</span></div><iframe id="fr" title="Eclipse episode"></iframe></div>
<script>
(function(){
var rd=document.getElementById('reader'),fr=document.getElementById('fr'),ready=false;
var ep=0;function load(n){if(ep!==n){fr.src='episode-'+n+'.html';ep=n}}
function openEp(n,push){load(n);document.getElementById('rt').textContent='Eclipse \u00b7 Episode '+n;rd.classList.add('open');rd.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';if(push)history.pushState({r:n},'','#episode-'+n)}
function shut(){try{fr.contentWindow.postMessage('stop',location.origin)}catch(e){}rd.classList.remove('open');rd.setAttribute('aria-hidden','true');document.body.style.overflow=''}
function back(){if(history.state&&history.state.r)history.back();else{shut();history.replaceState(null,'',location.pathname)}}
[1,2,3].forEach(function(n){document.getElementById('ep'+n).addEventListener('click',function(e){e.preventDefault();openEp(n,true)})});
document.getElementById('rb').addEventListener('click',back);
addEventListener('popstate',function(){var m=location.hash.match(/^#episode-(\d)$/);m?openEp(+m[1],false):shut()});
addEventListener('message',function(e){if(e.source===fr.contentWindow&&e.data==='close')back()});
addEventListener('load',function(){var m=location.hash.match(/^#episode-(\d)$/);if(m)openEp(+m[1],false);else setTimeout(function(){try{fetch('episode-1.html')}catch(e){}},900)});
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
var c=document.getElementById('rain'),x=c.getContext('2d'),W,H,d=[],dpr=Math.min(devicePixelRatio||1,2);
function sz(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
sz();addEventListener('resize',sz);
for(var i=0;i<70;i++)d.push({x:Math.random(),y:Math.random(),l:10+Math.random()*16,s:.012+Math.random()*.014});
(function f(){x.clearRect(0,0,W,H);x.strokeStyle='rgba(150,195,255,.28)';x.lineWidth=1;x.beginPath();
d.forEach(function(r){r.y+=r.s;if(r.y>1.05){r.y=-.05;r.x=Math.random()}var px=r.x*W,py=r.y*H;x.moveTo(px,py);x.lineTo(px-3,py+r.l)});x.stroke();requestAnimationFrame(f)})()}
})();
var RATE_URL='https://eclipse-ratings.wandile-shaw.workers.dev';
(function(){
var box=document.getElementById('rate'),st=document.querySelectorAll('#stars button'),msg=document.getElementById('rmsg'),mine=0,id;
function rid(){return String(Date.now())+Math.random().toString(36).slice(2,10)}
try{id=localStorage.getItem('eclid');if(!id){id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():rid();localStorage.setItem('eclid',id)}}catch(e){id=rid()}
function paint(n){st.forEach(function(b,i){b.classList.toggle('on',i<n)})}
function show(d){mine=d.mine||0;paint(mine);msg.textContent=mine?(d.n>=3?'Average '+d.avg.toFixed(1)+' \u2605 \u00b7 You rated '+mine+' \u2605':'Thanks for rating!'):'Tap a star to rate'}
fetch(RATE_URL+'/?id='+encodeURIComponent(id)).then(function(r){return r.json()}).then(function(d){box.hidden=false;show(d)}).catch(function(){});
st.forEach(function(b){b.addEventListener('click',function(){var s=+b.dataset.s;paint(s);msg.textContent='Saving...';fetch(RATE_URL+'/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,stars:s})}).then(function(r){return r.json()}).then(show).catch(function(){msg.textContent='Could not save. Try again.'})})});
})();
(function(){var L=[['cd',Date.UTC(2026,9,17,10,0,0)],['cd4',Date.UTC(2026,9,19,10,0,0)]];
function tick(){L.forEach(function(x){var e=document.getElementById(x[0]);if(!e)return;var ms=x[1]-Date.now();if(ms<=0){e.textContent='Releasing today';return}var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);e.textContent='Unlocks in '+(d?d+'d ':'')+h+'h '+m+'m'})}
tick();setInterval(tick,30000)})();
</script>
